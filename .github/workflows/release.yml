name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}

      - name: Package artifact
        run: |
          mkdir -p dist
          cp zig-out/bin/temp-control dist/temp-control
          cp config.example.conf dist/config.example.conf
          tar -C dist -czf temp-control-${{ matrix.target }}.tar.gz temp-control config.example.conf
          sha256sum temp-control-${{ matrix.target }}.tar.gz > temp-control-${{ matrix.target }}.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: temp-control-${{ matrix.target }}
          path: |
            temp-control-${{ matrix.target }}.tar.gz
            temp-control-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          generate_release_notes: true
